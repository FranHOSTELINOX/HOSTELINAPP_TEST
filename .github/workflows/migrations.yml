name: Aplicar migraciones de Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      repair_version:
        description: >-
          Version a marcar como ya aplicada SIN ejecutar su SQL (p. ej.
          0001), para cuando esa migracion ya se corrio a mano en el SQL
          Editor de Supabase. Dejar vacio para el comportamiento normal
          (aplicar migraciones pendientes).
        required: false
        default: ""

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Comprobar si existe el secret SUPABASE_DB_URL
        id: check_secret
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar de que falta el secret (no falla el workflow)
        if: steps.check_secret.outputs.found == 'false'
        run: |
          echo "::warning::El secret SUPABASE_DB_URL no está configurado todavía. Este workflow no aplicará ninguna migración hasta que lo añadas en Settings > Secrets and variables > Actions. Consulta docs/supabase.md para ver cómo obtenerlo."

      - name: Instalar Supabase CLI
        if: steps.check_secret.outputs.found == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migraciones nuevas o marcar una como ya aplicada
        if: steps.check_secret.outputs.found == 'true'
        env:
          REPAIR_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.repair_version || '' }}
        run: |
          if [ -n "$REPAIR_VERSION" ]; then
            supabase migration repair --status applied "$REPAIR_VERSION" --db-url "${{ secrets.SUPABASE_DB_URL }}"
          else
            supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
          fi
