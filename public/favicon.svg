<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Icono de pestaña: el logo de Hostelinox no se lee a 16 px (es un óvalo
       muy alargado), así que aquí va su esencia: la "H" azul marino sobre
       plata, con el travesaño en el rojo de "ostelinox". -->
  <defs>
    <linearGradient id="plata" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e1e6"/>
      <stop offset="55%" stop-color="#d6d5da"/>
      <stop offset="100%" stop-color="#a9a8b0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#plata)"/>
  <rect x="2.6" y="2.6" width="42.8" height="42.8" rx="11.4" fill="none"
        stroke="rgba(42,14,114,.18)" stroke-width="1.2"/>
  <rect x="12" y="12" width="7" height="24" rx="2.4" fill="#2a0e72"/>
  <rect x="29" y="12" width="7" height="24" rx="2.4" fill="#2a0e72"/>
  <rect x="17" y="20.5" width="14" height="7" rx="2.4" fill="#fd2015"/>
</svg>
